<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Titan Clay — v2</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/vazirmatn/index.css" />
<style>
  /* ============================================================ Titan identity (from titan-front globals.css) */
  :root {
    --wine: #65232d;        /* site frame */
    --wine-deep: #4d1720;   /* site frame-b */
    --panel: #3f1119;       /* site panel */
    --card: #4a1620;        /* site card */
    --clay: #702733;        /* raised clay: a shade lighter than the page */
    --red: #e2453f;
    --red-2: #f0645a;
    --purple: #7a50e6;
    --cream: #fff0b3;
    --text: #fdf1f0;
    --muted: #c98d92;
    --muted-2: #a86068;
    --font: 'Vazirmatn Variable', system-ui, sans-serif;
  }

  /*
   * Clay = a surface in the page's own colour, inflated by light: a lit top-left edge, a shaded bottom-right
   * edge, and a soft deep shadow under it. Coloured clay (red, cream, white) uses the same recipe on its fill.
   */
  .clay {
    --c: var(--clay);
    background: var(--c);
    border-radius: var(--r, 30px);
    box-shadow:
      0 20px 30px -16px rgba(26, 3, 8, 0.85),
      0 6px 10px -6px rgba(26, 3, 8, 0.6),
      inset 6px 8px 14px color-mix(in srgb, var(--c), #ffd9d9 var(--hi, 16%)),
      inset -6px -9px 16px color-mix(in srgb, var(--c), #1a0207 var(--lo, 45%));
  }
  /* A pressed-in well: inputs, progress tracks. */
  .well {
    background: var(--panel);
    border-radius: var(--r, 20px);
    box-shadow: inset 5px 7px 12px rgba(20, 2, 6, 0.75), inset -4px -5px 10px rgba(255, 200, 200, 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: #2a0a10; min-height: 100vh; display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; padding: 40px 16px; }
  .phone {
    position: relative; width: 390px; height: 844px; border-radius: 46px; overflow: hidden; color: var(--text);
    background:
      radial-gradient(360px 260px at 100% 0%, rgba(240, 100, 90, 0.18), transparent 70%),
      radial-gradient(320px 300px at 0% 100%, rgba(122, 80, 230, 0.14), transparent 70%),
      linear-gradient(180deg, var(--wine), var(--wine-deep));
    box-shadow: 0 30px 60px -20px #000, 0 0 0 10px #160307;
  }
  .scroll { height: 100%; overflow: hidden; padding: 18px 18px 120px; }
  img { display: block; max-width: 100%; }
  .ico { width: 34px; height: 34px; filter: drop-shadow(0 4px 4px rgba(30, 3, 9, 0.45)); }

  /* ============================================================ top */
  .top { display: flex; align-items: center; gap: 10px; }
  .logo { width: 46px; filter: drop-shadow(0 6px 10px rgba(226, 69, 63, 0.45)); }
  .spacer { flex: 1; }
  .round { --r: 50%; width: 46px; height: 46px; display: grid; place-items: center; position: relative; }
  .round .ico { width: 26px; height: 26px; }
  .dot { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--red); color: #fff; font-size: 10px; font-weight: 900; display: grid; place-items: center; box-shadow: 0 0 0 3px var(--wine); }
  .wallet { --c: var(--cream); --r: 999px; --hi: 60%; --lo: 18%; height: 46px; display: flex; align-items: center; gap: 6px; padding: 0 14px 0 6px; color: #5b3500; font-weight: 900; font-size: 14px; }
  .wallet .ico { width: 30px; height: 30px; }

  /* ============================================================ player */
  .player { margin-top: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px; --r: 32px; }
  .who { display: flex; align-items: center; gap: 12px; }
  .avatar { --c: var(--red); --r: 50%; --hi: 34%; --lo: 28%; width: 58px; height: 58px; display: grid; place-items: center; font-weight: 900; font-size: 24px; color: #fff; }
  .who-text { flex: 1; line-height: 1.35; }
  .who-text strong { font-size: 19px; font-weight: 900; display: block; }
  .tier { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; color: var(--cream); }
  .tier img { width: 18px; height: 18px; }
  .pts { display: flex; flex-direction: column; align-items: center; font-weight: 900; font-size: 18px; color: var(--cream); line-height: 1.2; }
  .pts small { font-size: 10.5px; color: var(--muted); font-weight: 700; }
  .xp { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); font-weight: 700; }
  .track { --r: 999px; flex: 1; height: 14px; padding: 3px; }
  .fill { height: 100%; width: 34%; border-radius: 999px; background: linear-gradient(90deg, var(--red-2), var(--red)); box-shadow: inset 0 2px 2px rgba(255, 255, 255, 0.35), 0 0 10px rgba(240, 100, 90, 0.6); }

  /* ============================================================ hero: the site's coral-pink banner, in clay */
  .hero { --c: var(--red); --r: 32px; --hi: 30%; --lo: 30%; position: relative; margin-top: 42px; height: 190px; overflow: visible; }
  .hero::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, rgba(255, 150, 175, 0.7), transparent 65%); pointer-events: none; }
  .hero .art { position: absolute; left: -8px; bottom: 0; width: 60%; height: 246px; object-fit: contain; object-position: bottom; filter: drop-shadow(0 12px 14px rgba(90, 0, 20, 0.45)); }
  .hero-body { position: absolute; inset: 18px 18px 18px auto; width: 48%; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .pill-cream { --c: var(--cream); --r: 999px; --hi: 60%; --lo: 16%; padding: 4px 10px; font-size: 12px; font-weight: 900; color: #6b3e00; display: inline-flex; align-items: center; gap: 4px; }
  .pill-cream img { width: 16px; height: 16px; }
  .hero h1 { font-size: 23px; font-weight: 900; line-height: 1.3; text-shadow: 0 2px 8px rgba(120, 10, 30, 0.35); }
  .hero p { font-size: 15px; font-weight: 900; }
  .pill-white { --c: #fff; --r: 999px; --hi: 70%; --lo: 12%; margin-top: auto; padding: 9px 16px; font-size: 13.5px; font-weight: 900; color: #3f1119; }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
  .dots i { width: 7px; height: 7px; border-radius: 4px; background: rgba(255, 220, 220, 0.25); }
  .dots i.on { width: 22px; background: var(--red-2); }

  /* ============================================================ quick actions */
  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 22px; }
  .q { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--text); }
  .q .clay { --r: 24px; width: 70px; height: 70px; display: grid; place-items: center; }
  .q .ico { width: 40px; height: 40px; }

  /* ============================================================ sections: the site's red bar + bold title */
  .sec { margin-top: 26px; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sec-head h3 { font-size: 19px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
  .sec-head h3::before { content: ''; width: 5px; height: 20px; border-radius: 4px; background: var(--red-2); box-shadow: 0 0 10px rgba(240, 100, 90, 0.7); }
  .sec-head a { font-size: 12.5px; font-weight: 800; color: var(--muted); text-decoration: none; }

  /* Game tiles: the game's own art sits in a clay bezel and the character steps out of it. */
  .games { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding-top: 28px; }
  .game { --r: 30px; position: relative; padding: 6px; height: 176px; }
  .game .bg { position: absolute; inset: 6px; border-radius: 25px; overflow: hidden; }
  .game .bg img { width: 100%; height: 100%; object-fit: cover; }
  .game .bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(40, 6, 12, 0.92)); }
  .game .char { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); width: 112%; max-width: none; height: 196px; object-fit: contain; object-position: bottom; filter: drop-shadow(0 10px 10px rgba(20, 2, 6, 0.55)); }
  .game strong { position: absolute; right: 18px; bottom: 16px; font-size: 16px; font-weight: 900; text-shadow: 0 2px 6px rgba(0,0,0,.6); }

  /* ============================================================ tab bar: the site's dark capsule with a raised red button */
  .tabbar { --c: var(--panel); --r: 32px; --hi: 10%; --lo: 50%; position: absolute; left: 14px; right: 14px; bottom: 16px; height: 74px; display: flex; align-items: center; justify-content: space-around; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 800; color: var(--muted-2); width: 60px; position: relative; }
  .tab svg { width: 24px; height: 24px; }
  .tab.on { color: var(--text); }
  .tab.on .btn { --c: var(--red); --r: 50%; width: 58px; height: 58px; display: grid; place-items: center; color: #fff; margin-top: -34px;
    box-shadow: 0 14px 22px -10px rgba(226, 69, 63, 0.9), inset 5px 7px 10px color-mix(in srgb, var(--red), #ffd9d9 32%), inset -5px -7px 12px color-mix(in srgb, var(--red), #1a0207 30%), 0 0 0 6px var(--wine-deep); }
  .tab .dot { top: -6px; left: 6px; box-shadow: 0 0 0 3px var(--panel); }

  /* ============================================================ product */
  .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .bar .t { flex: 1; font-size: 15px; font-weight: 800; color: var(--muted); }
  .stage { --c: var(--card); --r: 36px; height: 280px; position: relative; overflow: hidden; display: grid; place-items: center; }
  .stage::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, rgba(0, 212, 255, 0.32), transparent 60%); }
  .stage img { height: 200px; filter: drop-shadow(0 22px 22px rgba(10, 30, 60, 0.6)); position: relative; top: -14px; }
  .plinth { position: absolute; bottom: 30px; width: 190px; height: 34px; border-radius: 50%; background: var(--panel); box-shadow: inset 0 6px 10px rgba(20, 2, 6, 0.7), 0 1px 0 rgba(255, 200, 200, 0.1); }
  .tag-off { position: absolute; top: 16px; right: 16px; --c: var(--red); --r: 999px; --hi: 30%; --lo: 30%; padding: 4px 12px; font-weight: 900; font-size: 13px; }
  .pt { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; }
  .pt h1 { font-size: 24px; font-weight: 900; line-height: 1.35; }
  .pt p { color: var(--muted); font-size: 13.5px; }
  .facts { display: flex; gap: 8px; margin-top: 4px; }
  .fact { --r: 16px; padding: 6px 10px 6px 12px; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
  .fact img { width: 20px; height: 20px; }
  .packs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .pack { --r: 22px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .pack strong { font-size: 16px; font-weight: 900; }
  .pack span { font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .pack.sel { --c: var(--red); --hi: 30%; --lo: 30%; }
  .pack.sel span { color: rgba(255, 240, 235, 0.9); }
  .buy { --c: var(--panel); --r: 30px; --hi: 10%; --lo: 50%; position: absolute; left: 14px; right: 14px; bottom: 16px; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 18px; }
  .buy .total { flex: 1; line-height: 1.25; }
  .buy small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }
  .buy strong { font-size: 20px; font-weight: 900; }
  .big { --c: var(--red); --r: 22px; --hi: 30%; --lo: 30%; padding: 14px 20px; font-weight: 900; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .big img { width: 24px; height: 24px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 7H6"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
</svg>

<template id="home">
  <div class="scroll">
    <div class="top">
      <img class="logo" src="../public/titan-logo.webp" alt="تایتان" />
      <div class="spacer"></div>
      <div class="clay wallet"><img class="ico" src="../public/clay/coin.webp" alt="" />۱٫۴۵ میلیون</div>
      <div class="clay round"><img class="ico" src="../public/clay/bell.webp" alt="" /><span class="dot">۳</span></div>
    </div>

    <div class="clay player">
      <div class="who">
        <div class="clay avatar">ط</div>
        <div class="who-text">
          <strong>TahaTitan</strong>
          <span class="tier"><img src="../public/clay/crown.webp" alt="" />برنز، سطح ۱</span>
        </div>
        <div class="pts">۲۵<small>امتیاز</small></div>
      </div>
      <div class="xp"><div class="well track"><div class="fill"></div></div><span>۱۲۰ از ۸۰۰ XP</span></div>
    </div>

    <div class="clay hero">
      <img class="art" src="../../titan-front/public/images/fortnite-crewpack-october2026.webp" alt="" />
      <div class="hero-body">
        <span class="clay pill-cream"><img src="../public/clay/fire.webp" alt="" />محبوب</span>
        <h1>کروپک فورتنایت</h1>
        <p>۵۹۹٬۰۰۰ تومان</p>
        <span class="clay pill-white">مشاهده محصول</span>
      </div>
    </div>
    <div class="dots"><i class="on"></i><i></i><i></i></div>

    <div class="quick">
      <div class="q"><div class="clay"><img class="ico" src="../public/clay/package.webp" alt="" /></div>سفارش‌ها</div>
      <div class="q"><div class="clay"><img class="ico" src="../public/clay/shield.webp" alt="" /></div>تیم من</div>
      <div class="q"><div class="clay"><img class="ico" src="../public/clay/trophy.webp" alt="" /></div>مسابقات</div>
      <div class="q"><div class="clay"><img class="ico" src="../public/clay/headphone.webp" alt="" /></div>پشتیبانی</div>
    </div>

    <div class="sec">
      <div class="sec-head"><h3>دسته‌بندی‌ها</h3><a href="#">همه</a></div>
      <div class="games">
        <div class="clay game">
          <div class="bg"><img src="https://35tmectztpibboo6.public.blob.vercel-storage.com/games/games-fortnite-background.png" alt="" /></div>
          <img class="char" src="https://35tmectztpibboo6.public.blob.vercel-storage.com/games/games-fortnite-character.png" alt="" />
          <strong>فورتنایت</strong>
        </div>
        <div class="clay game">
          <div class="bg"><img src="https://35tmectztpibboo6.public.blob.vercel-storage.com/games/games-valorant-background.png" alt="" /></div>
          <img class="char" src="https://35tmectztpibboo6.public.blob.vercel-storage.com/games/games-valorant-character.png" alt="" />
          <strong>ولورنت</strong>
        </div>
      </div>
    </div>
  </div>
  <nav class="clay tabbar">
    <div class="tab"><svg><use href="#i-user"/></svg>پروفایل</div>
    <div class="tab"><span class="dot">۲</span><svg><use href="#i-cart"/></svg>سبد</div>
    <div class="tab"><svg><use href="#i-trophy"/></svg>مسابقات</div>
    <div class="tab"><svg><use href="#i-bag"/></svg>فروشگاه</div>
    <div class="tab on"><span class="clay btn"><svg><use href="#i-home"/></svg></span>خانه</div>
  </nav>
</template>

<template id="product">
  <div class="scroll">
    <div class="bar">
      <div class="t">فورتنایت</div>
      <div class="clay round"><img class="ico" src="../public/clay/red-heart.webp" alt="" style="opacity:.55" /></div>
    </div>
    <div class="clay stage">
      <div class="plinth"></div>
      <img src="https://35tmectztpibboo6.public.blob.vercel-storage.com/products/products-vbucks.png" alt="" />
      <span class="clay tag-off">٪۱۵ تخفیف</span>
    </div>
    <div class="pt">
      <h1>وی‌باکس فورتنایت</h1>
      <p>شارژ مستقیم روی اکانت اپیک، معمولاً کمتر از ۱۵ دقیقه.</p>
      <div class="facts">
        <span class="clay fact"><img src="../public/clay/high-voltage.webp" alt="" />تحویل آنی</span>
        <span class="clay fact"><img src="../public/clay/glowing-star.webp" alt="" />۴٫۷ از ۵</span>
        <span class="clay fact"><img src="../public/clay/shield.webp" alt="" />قانونی</span>
      </div>
    </div>
    <div class="packs">
      <div class="clay pack sel"><strong>۱٬۰۰۰ وی‌باکس</strong><span>۲۹۹٬۰۰۰ تومان</span></div>
      <div class="clay pack"><strong>۲٬۸۰۰ وی‌باکس</strong><span>۷۴۹٬۰۰۰ تومان</span></div>
      <div class="clay pack"><strong>۵٬۰۰۰ وی‌باکس</strong><span>۱٬۱۹۹٬۰۰۰ تومان</span></div>
      <div class="clay pack"><strong>۱۳٬۵۰۰ وی‌باکس</strong><span>۲٬۹۹۹٬۰۰۰ تومان</span></div>
    </div>
  </div>
  <div class="clay buy">
    <div class="total"><small>مبلغ</small><strong>۲۹۹٬۰۰۰ تومان</strong></div>
    <div class="clay big"><img src="../public/clay/shopping-cart.webp" alt="" />افزودن به سبد</div>
  </div>
</template>

<div class="phone" data-screen="home"></div>
<div class="phone" data-screen="product"></div>

<script>
  for (const phone of document.querySelectorAll('.phone')) {
    phone.append(document.getElementById(phone.dataset.screen).content.cloneNode(true));
  }
</script>
</body>
</html>
